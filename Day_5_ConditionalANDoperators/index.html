<body>
<script>
    let marks = Number(prompt("Enter Marks: "));
    let grade;

    switch(true) {
        case(marks >= 100 && marks < 0):    
        grade = "Invalid Marks";
        break; 
         
        case(marks >= 90 ): 
            grade = "Grade A";
            break;

        case(marks >=80):
            grade = "Grade B";
            break;

        case(marks >= 65):
            grade = "Grade C";
            break;

        case(marks >= 33):
            grade = "Grade D";
            break;

        case(marks >=0):
            grade = "Govind Padhle";
            break; 
 
        default:
            grade = "Invalid Marks";
    }

    alert(grade);
</script>
